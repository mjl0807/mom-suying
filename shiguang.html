<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>那些年 · 1990—2025 · 素英</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8f5f0; --cream: #f5efe8;
            --sage: #8a9a7a; --sage-l: #d4dfc8; --sage-d: #5d6d4e;
            --ink: #2c2c2c; --warm: #d4b8a0; --gold: #c9a96e; --rose: #e0b4a4;
            --card: rgba(255,255,255,0.72);
            --shadow: 0 8px 32px rgba(0,0,0,0.06);
            --serif: "Noto Serif SC", Georgia, serif;
            --sans: "Noto Sans SC", system-ui, sans-serif;
        }
        html { scroll-behavior: smooth; }
        body { font-family: var(--sans); font-weight: 400; background: var(--bg); color: var(--ink); line-height: 1.8; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--sage-l); border-radius: 4px; }

        nav {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; gap: 18px;
            padding: 14px 28px; background: rgba(248,245,240,0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(138,154,122,0.15);
        }
        nav .logo { font-family: var(--serif); letter-spacing: 1px; color: var(--ink); }
        nav .logo span { color: var(--gold); }
        nav a.back { color: var(--sage-d); text-decoration: none; font-size: 0.85rem; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 4px; }
        nav a.back:hover { color: var(--gold); }

        .hero { text-align: center; padding: 60px 20px 30px; }
        .hero .eyebrow { color: var(--sage); letter-spacing: 4px; font-size: 0.78rem; }
        .hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.8rem, 5vw, 3rem); color: var(--sage-d); letter-spacing: 6px; margin: 12px 0 8px; }
        .hero p { color: var(--sage); font-size: 0.9rem; }
        .hero .divider { width: 46px; height: 1.5px; background: var(--gold); margin: 22px auto 0; }

        .era-nav {
            position: sticky; top: 58px; z-index: 40;
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            padding: 12px 16px; background: rgba(248,245,240,0.92); backdrop-filter: blur(10px);
        }
        .era-nav a {
            text-decoration: none; color: var(--sage-d);
            background: var(--card); border: 1px solid rgba(138,154,122,0.25);
            padding: 6px 16px; border-radius: 999px; font-size: 0.8rem; letter-spacing: 1px; transition: all .2s;
        }
        .era-nav a:hover, .era-nav a.on { background: var(--sage); color: #fff; border-color: var(--sage); }

        main { max-width: 1100px; margin: 0 auto; padding: 10px 20px 80px; }
        .era {
            background: var(--card); backdrop-filter: blur(6px);
            border: 1px solid rgba(138,154,122,0.15); border-radius: 16px;
            padding: 26px 24px 22px; margin: 26px 0; box-shadow: var(--shadow);
            scroll-margin-top: 130px;
        }
        .era-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--sage-l); }
        .era-year { font-family: var(--serif); font-size: 1.4rem; color: var(--sage-d); letter-spacing: 2px; font-weight: 600; }
        .era-tag { font-size: 0.78rem; color: var(--warm); letter-spacing: 2px; }

        .cat { margin-top: 18px; }
        .cat h3 { font-family: var(--serif); font-size: 0.95rem; color: var(--sage-d); letter-spacing: 2px; margin-bottom: 4px; font-weight: 600; }
        .cat .note { font-size: 0.72rem; color: #b8a98f; margin-left: 6px; letter-spacing: 0; font-weight: 400; }

        .strip { display: flex; gap: 12px; overflow-x: auto; padding: 8px 2px 16px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
        .strip::-webkit-scrollbar { height: 6px; }
        .strip::-webkit-scrollbar-thumb { background: var(--sage-l); border-radius: 4px; }

        .card {
            position: relative; flex: 0 0 auto; scroll-snap-align: start;
            min-width: 150px; max-width: 210px;
            background: #fff; border: 1px solid rgba(138,154,122,0.18); border-radius: 12px;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
            transition: transform .2s, box-shadow .2s, border-color .2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); border-color: var(--sage); }
        .card .card-link { position: absolute; inset: 0; z-index: 1; border-radius: 12px; }
        .card .t { font-family: var(--serif); font-size: 0.92rem; color: var(--ink); line-height: 1.5; }
        .card .s { font-size: 0.75rem; color: var(--sage); }
        .card .go { font-size: 0.7rem; color: #c5b394; margin-top: 2px; }

        .card.fav { padding-top: 30px; }
        .heart {
            position: absolute; top: 8px; right: 8px; z-index: 3;
            background: none; border: none; cursor: pointer;
            font-size: 1.15rem; line-height: 1; padding: 2px 4px;
            color: #d8c9b4; transition: transform .15s, color .15s;
        }
        .heart:hover { transform: scale(1.25); }
        .heart.on { color: var(--rose); }

        /* 春晚节目单 */
        .gala-list { margin-top: 4px; }
        .gala-year {
            background: #fff; border: 1px solid rgba(138,154,122,0.18);
            border-radius: 10px; margin-bottom: 8px; overflow: hidden;
        }
        .gala-year summary {
            cursor: pointer; list-style: none; padding: 10px 14px;
            display: flex; align-items: baseline; gap: 10px;
            font-family: var(--serif); color: var(--sage-d); font-size: 0.95rem;
        }
        .gala-year summary::-webkit-details-marker { display: none; }
        .gala-year summary::before { content: '▸'; color: var(--gold); transition: transform .2s; }
        .gala-year[open] summary::before { transform: rotate(90deg); }
        .gala-year .gala-cnt { font-size: 0.72rem; color: #b8a98f; font-family: var(--sans); }
        .gala-year .gala-yr { font-weight: 600; }
        .gala-items { list-style: none; padding: 0 14px 12px; columns: 2; column-gap: 22px; }
        .gala-items li { font-size: 0.78rem; line-height: 1.9; break-inside: avoid; }
        .gala-items a { color: #555; text-decoration: none; }
        .gala-items a:hover { color: var(--sage-d); }
        .gala-year.empty { padding: 10px 14px; font-size: 0.85rem; color: #c5b394; }

        /* 新闻 */
        .yr-card { flex: 0 0 auto; scroll-snap-align: start; width: 250px; background: #fff; border: 1px solid rgba(138,154,122,0.18); border-radius: 12px; padding: 14px 16px; }
        .yr-card .yr { font-family: var(--serif); font-weight: 600; color: var(--gold); font-size: 1.05rem; letter-spacing: 1px; margin-bottom: 6px; }
        .yr-card .item { font-size: 0.8rem; color: #555; line-height: 1.7; }
        .yr-card .item a { color: #555; text-decoration: none; border-bottom: 1px dashed var(--sage-l); }
        .yr-card .item a:hover { color: var(--sage-d); border-bottom-color: var(--sage-d); }
        .yr-card .pending { color: #c5b394; font-size: 0.78rem; font-style: italic; }

        footer { text-align: center; padding: 30px 20px 50px; color: var(--sage); font-size: 0.8rem; }
        footer a { color: var(--sage-d); text-decoration: none; }

        @media (max-width: 600px) {
            nav { padding: 12px 16px; }
            .era { padding: 20px 16px 16px; }
            .card { min-width: 132px; }
            .yr-card { width: 220px; }
            .gala-items { columns: 1; }
        }
    </style>
</head>

        const FAV_KEY = 'mom_fav_films_v2';
        let favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
        function toggleFav(btn) {
            const key = btn.dataset.key;
            if (favs.has(key)) { favs.delete(key); } else { favs.add(key); }
            localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
            paintHeart(btn);
        }
        function paintHeart(btn) {
            const on = favs.has(btn.dataset.key);
            btn.classList.toggle('on', on);
            btn.textContent = on ? '♥' : '♡';
        }

        function favCard(t, href) {
            return `<div class="card fav">
                <a class="card-link" href="${href}" target="_blank" rel="noopener"></a>
                <button class="heart" data-key="${t}" onclick="toggleFav(this)" aria-label="收藏">♡</button>
                <span class="t">${t}</span>
                <span class="go">去看看 →</span>
            </div>`;
        }
        function card(t, s, href) {
            return `<div class="card">
                <a class="card-link" href="${href}" target="_blank" rel="noopener"></a>
                <span class="t">${t}</span>
                ${s ? `<span class="s">${s}</span>` : ''}
                <span class="go">去看看 →</span>
            </div>`;
        }
        function galaBlock(year) {
            const items = GALA[year];
            if (!items || !items.length) {
                return `<div class="gala-year empty">${year}年 · <span class="pending">（待补充）</span></div>`;
            }
            const open = items.length <= 4 ? ' open' : '';
            const list = items.map(it => `<li><a href="${L.gala(year, it)}" target="_blank" rel="noopener">${it}</a></li>`).join('');
            return `<details class="gala-year"${open}>
                <summary><span class="gala-yr">${year}年</span><span class="gala-cnt">${items.length} 个节目</span></summary>
                <ul class="gala-items">${list}</ul>
            </details>`;
        }
        function yrCard(year, items) {
            let body = !items || !items.length
                ? `<span class="pending">（待补充）</span>`
                : items.map(it => `<div class="item"><a href="${L.news(year, it)}" target="_blank" rel="noopener">${it}</a></div>`).join('');
            return `<div class="yr-card"><div class="yr">${year}</div>${body}</div>`;
        }

        function render() {
            document.getElementById('era-nav').innerHTML = ERAS.map((e, i) =>
                `<a href="#era-${i}">${e.range.split(' — ')[0]}</a>`).join('');

            document.getElementById('content').innerHTML = ERAS.map((e, i) => `
                <section class="era" id="era-${i}">
                    <div class="era-head">
                        <span class="era-year">${e.range}</span>
                        ${e.tag ? `<span class="era-tag">${e.tag}</span>` : ''}
                    </div>
                    <div class="cat"><h3>📺 电视剧<span class="note">点 ♥ 收藏你俩都喜欢的</span></h3><div class="strip">${e.tv.map(t => favCard(t, L.film(t))).join('')}</div></div>
                    <div class="cat"><h3>🎬 电影</h3><div class="strip">${e.movie.map(t => favCard(t, L.film(t))).join('')}</div></div>
                    <div class="cat"><h3>🎪 综艺</h3><div class="strip">${e.variety.map(t => favCard(t, L.film(t))).join('')}</div></div>
                    <div class="cat"><h3>🎵 歌曲</h3><div class="strip">${e.song.map(([t,s]) => card(t, s, L.song(t))).join('')}</div></div>
                    <div class="cat"><h3>📖 杂志</h3><div class="strip">${e.mag.map(m => card(m, null, L.mag(m))).join('')}</div></div>
                    <div class="cat"><h3>🎊 春晚节目单<span class="note">点年份展开</span></h3><div class="gala-list">${e.years.map(y => galaBlock(y)).join('')}</div></div>
                    <div class="cat"><h3>📰 年度新闻</h3><div class="strip">${e.news.map(([y, it]) => yrCard(y, it)).join('')}</div></div>
                </section>
            `).join('');

            document.querySelectorAll('.heart').forEach(paintHeart);
        }

        function highlightNav() {
            const links = document.querySelectorAll('#era-nav a');
            let cur = 0;
            ERAS.forEach((e, i) => {
                const el = document.getElementById('era-' + i);
                if (el && el.getBoundingClientRect().top < 200) cur = i;
            });
            links.forEach((a, i) => a.classList.toggle('on', i === cur));
        }

        render();
        window.addEventListener('scroll', highlightNav, { passive: true });
        highlightNav();
    </script>
