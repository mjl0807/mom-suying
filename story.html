<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 她的故事 · 素英</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8f5f0;
            --cream: #f5efe8;
            --sage: #8a9a7a;
            --sage-l: #d4dfc8;
            --sage-d: #5d6d4e;
            --ink: #2c2c2c;
            --warm: #d4b8a0;
            --gold: #c9a96e;
            --rose: #e0b4a4;
            --card: rgba(255,255,255,0.7);
            --shadow: 0 8px 32px rgba(0,0,0,0.06);
            --serif: "Noto Serif SC", Georgia, serif;
            --sans: "Noto Sans SC", system-ui, sans-serif;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--sans);
            font-weight: 400;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.8;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--sage-l); border-radius: 4px; }

        /* ─── nav ─── */
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 14px 36px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
            background: rgba(248,245,240,0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(138,154,122,0.12);
        }
        nav .logo {
            font-family: var(--serif);
            font-size: 0.95rem;
            color: var(--sage-d);
            letter-spacing: 3px;
        }
        nav .logo span { color: var(--gold); }
        nav .back-link {
            text-decoration: none; color: var(--sage);
            font-size: 0.82rem; letter-spacing: 1px;
            transition: color 0.2s;
        }
        nav .back-link:hover { color: var(--sage-d); }

        /* ─── main ─── */
        .page-main {
            padding-top: 80px;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 80px;
        }

        .page-title {
            font-family: var(--serif);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--sage-d);
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 4px;
            padding-top: 30px;
        }
        .page-sub {
            text-align: center;
            color: var(--sage);
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 300;
            margin-bottom: 30px;
        }
        .page-divider {
            width: 36px; height: 2px;
            background: var(--sage);
            margin: 10px auto 30px;
            border-radius: 2px;
        }

        /* ─── toolbar ─── */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--sans);
        }
        .btn-primary {
            background: var(--sage);
            color: #fff;
        }
        .btn-primary:hover { background: var(--sage-d); }
        .btn-secondary {
            background: var(--cream);
            color: var(--sage-d);
            border: 1px solid var(--sage-l);
        }
        .btn-secondary:hover { background: var(--sage-l); }
        .btn-danger {
            background: #e8c4b8;
            color: #7a3a2a;
        }
        .btn-danger:hover { background: #d4a898; }
        .btn-sm { padding: 5px 14px; font-size: 0.75rem; }
        .toolbar .right-btns { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ─── chapter list ─── */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chapter-card {
            background: var(--card);
            border: 1px solid rgba(138,154,122,0.15);
            border-radius: 12px;
            padding: 18px 22px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .chapter-card .ch-title {
            font-family: var(--serif);
            font-size: 1.05rem;
            color: var(--sage-d);
            letter-spacing: 1px;
            font-weight: 600;
        }
        .chapter-card .ch-meta {
            font-size: 0.75rem;
            color: var(--sage);
            margin-top: 2px;
        }
        .chapter-card .ch-preview {
            font-size: 0.85rem;
            color: #666;
            margin-top: 6px;
            line-height: 1.6;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .chapter-card .ch-actions {
            margin-top: 10px;
            display: flex;
            gap: 6px;
        }
        .empty-state {
            text-align: center;
            color: var(--sage);
            padding: 60px 20px;
            border: 1px dashed var(--sage-l);
            border-radius: 12px;
            background: var(--card);
        }
        .empty-state .big-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .empty-state p { font-size: 0.9rem; }

        /* ─── editor overlay ─── */
        .editor-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            padding: 20px;
        }
        .editor-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .editor-panel {
            background: #fff;
            border-radius: 16px;
            padding: 30px 32px;
            width: 100%;
            max-width: 640px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
        }
        .editor-panel .editor-title {
            font-family: var(--serif);
            font-size: 1.2rem;
            color: var(--sage-d);
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .editor-panel label {
            display: block;
            font-size: 0.8rem;
            color: var(--sage);
            letter-spacing: 1px;
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .editor-panel input[type="text"],
        .editor-panel textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--sage-l);
            border-radius: 8px;
            font-size: 0.92rem;
            font-family: var(--sans);
            background: var(--bg);
            outline: none;
            transition: border-color 0.2s;
        }
        .editor-panel input:focus,
        .editor-panel textarea:focus { border-color: var(--sage); }
        .editor-panel textarea { min-height: 200px; resize: vertical; }
        .editor-panel .editor-btns {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .editor-panel .editor-status {
            font-size: 0.78rem;
            color: var(--sage-d);
            margin-top: 8px;
            min-height: 1.2em;
        }
        .editor-panel .close-x {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--sage);
            transition: color 0.2s;
            background: none;
            border: none;
        }
        .editor-panel .close-x:hover { color: var(--ink); }

        /* ─── reader overlay ─── */
        .reader-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            padding: 20px;
        }
        .reader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .reader-panel {
            background: #fcfaf7;
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
        }
        .reader-panel .reader-title {
            font-family: var(--serif);
            font-size: 1.5rem;
            color: var(--sage-d);
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .reader-panel .reader-meta {
            font-size: 0.78rem;
            color: var(--sage);
            margin-bottom: 20px;
        }
        .reader-panel .reader-content {
            font-family: var(--serif);
            font-size: 1rem;
            line-height: 2;
            color: #3d3d3d;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .reader-panel .reader-close {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--sage);
            transition: color 0.2s;
            background: none;
            border: none;
        }
        .reader-panel .reader-close:hover { color: var(--ink); }

        /* ─── responsive ─── */
        @media (max-width: 600px) {
            nav { padding: 12px 16px; }
            .page-main { padding-top: 70px; padding-left: 14px; padding-right: 14px; }
            .editor-panel { padding: 20px 18px; }
            .reader-panel { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">素英<span>.</span></div>
        <a href="/" class="back-link">← 回到主页</a>
    </nav>

    <div class="page-main">
        <div class="page-title">📖 她的故事</div>
        <div class="page-sub">记忆从未远去</div>
        <div class="page-divider"></div>

        <!-- toolbar -->
        <div class="toolbar">
            <div style="font-size:0.85rem;color:var(--sage);letter-spacing:1px;">
                📝 <span id="chapter-count">0</span> 个篇章

            </div>

        <div id="chapter-list" class="chapter-list"></div>

    <!-- Editor overlay -->
    <div class="editor-overlay" id="editor-overlay">
        <div class="editor-panel">
            <button class="close-x" onclick="closeEditor()">✕</button>
            <div class="editor-title" id="editor-title">新篇章</div>

            <label>标题</label>
            <input type="text" id="editor-ch-title" placeholder="给这段回忆取个名字……" />

            <label>正文</label>
            <textarea id="editor-ch-content" placeholder="写下一段关于妈妈的故事……&#10;一篇文章、一段对话、一个瞬间……"></textarea>

            <div class="editor-btns">
                <button class="btn btn-secondary btn-sm" onclick="closeEditor()">取消</button>
                <button class="btn btn-primary btn-sm" id="editor-save-btn" onclick="saveChapter()">保存</button>
            </div>
            <div class="editor-status" id="editor-status"></div>
        </div>
    </div>

    <!-- Reader overlay -->
    <div class="reader-overlay" id="reader-overlay">
        <div class="reader-panel">
            <button class="reader-close" onclick="closeReader()">✕</button>
            <div class="reader-title" id="reader-title"></div>
            <div class="reader-meta" id="reader-meta"></div>
            <div class="reader-content" id="reader-content"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // 📖 她的故事 — 篇章管理
        // ═══════════════════════════════════════════════════════════

        const STORAGE_KEY = 'momsuying_story_chapters';

        // ─── 内置默认篇章（首次访问自动载入；用户编辑后以 localStorage 为准）───
        const DEFAULT_CHAPTERS = [
            {
                "id": "default-work",
                "title": "妈妈的工作",
                "content": "妈妈在巴彦淖尔市财校工作，后来学校并入河套大学。\n\n妈妈在学校的后勤部门工作，是一名面食厨师。她最拿手的是中式糕点——做出来的点心香甜软糯，同事们都说好。还有她的河北烙盒子，馅大皮薄，咬一口满嘴香。\n\n妈妈有中级厨师职称，这在后勤岗位上是不多见的。她对这个职称很看重，因为那是她靠自己的手艺实实在在考下来的。食堂的活儿不轻松，每天凌晨三四点就要起来和面、发面，赶在师生们早餐前准备好。冬天冷，面发得慢，需要提前备好温水和面；夏天热，厨房里像个蒸笼，妈妈围着围裙一站就是几个小时。但她从不喊累，她说做面食是她的本行，看着大家吃得高兴她就开心。\n\n在食堂工作的那些年，妈妈结交了很多好朋友。她们一起干活儿、一起说笑，妈妈性格好，大家都喜欢跟她相处。那些朋友是她生活中很重要的陪伴。可后来因为跟着我们来了深圳，距离远了，慢慢地朋友圈子就联系变少了。妈妈偶尔还会提起她们，每次说起来，眼里都有怀念。\n\n1998年，妈妈和爸爸一样提前退休了。但她闲不住，退休以后开始自己在家做大饼、卖饼丝。每天凌晨四五点就要起床——妈妈后来跟我说，那会儿起来是人最困的时候。但她一天也没落下，就这样起早贪黑，一直做到我2006年上大学。\n\n在财校的那些年里，妈妈见证了学校的发展变化，也见证了学生们来了一茬又走了一茬。很多学生毕业后还记得食堂那个做面食特别好吃的阿姨。\n\n后来，巴彦淖尔市财校并入河套大学，妈妈也随着到了新学校继续在后勤岗位工作。"
            },
            {
                "id": "default-hometown-before",
                "title": "妈妈离开家乡前",
                "content": "1954年，妈妈出生在河北省三河市大王各庄。那不是一般的农家——姥爷是当地的地主，家里有些田产。然而，在那个风云激荡的年代，这个身份注定了命运的不同走向。\n\n就在妈妈出生前后，新中国刚刚成立，全国范围内轰轰烈烈的土地改革运动正在展开。1947年颁布的《中国土地法大纲》拉开了这场革命的序幕，到了1950年《中华人民共和国土地改革法》正式实施，占农村人口不到10%的地主、富农占有的可耕土地被没收，分给了无地少地的贫苦农民。姥爷家的田地就是在那个时候被分掉的。所谓“反封建、打倒地主”，对年幼的妈妈来说，是家庭从殷实到清贫的剧变。\n\n三河地处京畿，燕山脚下、潮白河畔，本是土地肥沃的地方。土改之后，家家户户分到了一点田地，但日子依然艰难。妈妈是家里最小的孩子，上面有哥哥姐姐。村里没有电，天一黑整个世界就沉入黑暗，唯一的亮光来自那盏煤油灯——豆大的火苗在灯芯上跳跃，把人的影子拉得老长。灯芯要不时用针挑一挑，不然结了灯花光线会更暗。妈妈就在这昏黄的灯光下做缝纫活儿，一针一线地缝补衣服、纳鞋底。她的手艺是跟姥姥学的，做得又快又好，村里人都说这女娃子手巧。\n\n到了上学的年纪，妈妈背起哥哥姐姐用过的旧书包去了村里的学堂。那大概是1959年前后，正好赶上了三年困难时期的前奏。学堂是村里腾出的几间土房，课桌是用木板搭的，坐的是长条凳。老师是村里识字最多的人，教的是最基本的认字和算术。妈妈很珍惜上学的机会，每天天不亮就起来，走几里地去学堂。\n\n但好景不长。到了1960年代初，情况越来越难。当时农村实行人民公社制度，土地归集体所有，每家每户靠挣工分分粮食。所谓工分，就是生产队根据每个人干的活儿记分——男劳力一天10分，妇女一天6到8分，半大孩子3到5分。到了年底，全队按总工分分粮分钱。妈妈虽然年纪小，也得跟着下地干力所能及的活儿：拾麦穗、拔草、放羊、喂鸡……这些活儿换不来多少工分，但能帮家里减轻一点负担。\n\n那时候村里渐渐有了说法：读书有什么用？还不如多挣几个工分。渐渐地，学堂里的孩子越来越少。先是几个大点的男孩退学了，接着女孩们也一个接一个不来了。妈妈也终于没能继续读下去。对那个年代的农村女孩来说，能识几个字就已经是奢侈了。\n\n不上学了，妈妈就成了生产队里的半劳力。她个子小，力气不大，但从不偷懒。春天跟着插秧，夏天顶着日头锄草，秋天弯腰收庄稼。最苦的是冬天，北方冬天的田野一片荒芜，但活儿并不少——沤肥、修渠、平整土地，手冻得跟胡萝卜似的，皲裂的口子往外渗血。\n\n回到家也不能歇着。妈妈最拿手的就是缝纫。每到晚上，她就着煤油灯做针线活儿——给家里人缝补衣裳、纳鞋底、做棉袄。煤油灯的光很暗，做一会儿眼睛就酸了，第二天擤鼻涕都是黑的。但妈妈的手艺好，针脚又密又匀，村里有人家要做嫁妆、做小孩衣服，也会找她帮忙。帮别人做活儿偶尔能换几个鸡蛋、一把挂面，那就是家里难得的改善。\n\n那些年，妈妈就这样在生产队和家之间两点一线地过着日子。没有什么惊天动地的大事，就是一天一天地过。河北的冬天很长，风从燕山那边刮过来，刮在脸上像刀子割。但妈妈说起那些日子，很少抱怨——她说那时候家家都一样，谁也不比谁好过多少。\n\n后来，村里的年轻人开始往外走。有人说北京招工，有人说天津好找活儿，还有人嫁到了更远的地方。妈妈也在心里埋下了离开的念头。三河离北京不过几十公里，坐火车几个小时就能到。妈妈知道，如果要改变命运，就得走出去。于是，在她还不到二十岁的时候，她收拾好简单的行李，把几件换洗衣服叠得整整齐齐，揣着家里攒的一点零钱，坐上了那趟开往远方的火车。\n\n火车开动的那一刻，窗外的田野、村庄、麦田缓缓后退。妈妈不知道前方等着她的是什么，但她知道，离开是她唯一的选择。\n\n那是她第一次离开家乡，也是她人生中最重要的一次出发。\n\n📚 参考资料：\n• 土地改革·百度百科：https://baike.baidu.com/item/%E5%9C%9F%E5%9C%B0%E6%94%B9%E9%9D%A9/3455375\n• 中国土地法大纲·百度百科：https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E5%9C%9F%E5%9C%B0%E6%B3%95%E5%A4%A7%E7%BA%B2\n• 中华人民共和国土地改革法：https://baike.baidu.com/item/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E5%9C%9F%E5%9C%B0%E6%94%B9%E9%9D%A9%E6%B3%95"
            },
            {
                "id": "default-ovarian",
                "title": "卵巢癌——沉默的杀手",

        function getChapters() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
                // 首次访问：没有本地数据则播种默认篇章
                const defaults = DEFAULT_CHAPTERS.map((c, i) => ({
                    ...c,
                    createdAt: c.createdAt || (1783000000000 + i * 1000),
                    updatedAt: Date.now()
                }));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
                return defaults;
            } catch(e) { return []; }
        }
        function saveChapters(chapters) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chapters));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        // ─── 渲染 ───
        function renderChapterList() {
            const chapters = getChapters();
            const list = document.getElementById('chapter-list');
            const empty = document.getElementById('empty-state');
            const count = document.getElementById('chapter-count');

            count.textContent = chapters.length;

            if (chapters.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            chapters.sort((a, b) => b.createdAt - a.createdAt);

            list.innerHTML = chapters.map(ch => {
                const date = new Date(ch.createdAt).toLocaleDateString('zh-CN', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                const preview = (ch.content || '').slice(0, 100);
                return `
                    <div class="chapter-card" onclick="openReader('${ch.id}')">
                        <div class="ch-title">${esc(ch.title || '无标题')}</div>
                        <div class="ch-meta">${date} · ${countWords(ch.content)} 字</div>
                        ${preview ? `<div class="ch-preview">${esc(preview)}${preview.length >= 100 ? '…' : ''}</div>` : ''}
                        <div class="ch-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-secondary btn-sm" onclick="openEditor('${ch.id}')">✏️ 编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteChapter('${ch.id}')">🗑 删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function countWords(text) {
            if (!text) return 0;
            return text.replace(/\s/g, '').length;
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ─── 编辑器 ───
        let editingId = null;

        function openEditor(chapterId) {
            editingId = chapterId || null;
            const overlay = document.getElementById('editor-overlay');
            const titleEl = document.getElementById('editor-title');
            const chTitle = document.getElementById('editor-ch-title');
            const chContent = document.getElementById('editor-ch-content');
            const status = document.getElementById('editor-status');

            status.textContent = '';
            chTitle.value = '';
            chContent.value = '';

            if (chapterId) {
                const chapters = getChapters();
                const ch = chapters.find(c => c.id === chapterId);
                if (ch) {
                    chTitle.value = ch.title || '';
                    chContent.value = ch.content || '';
                    titleEl.textContent = '编辑篇章';
                } else {
                    editingId = null;
                    titleEl.textContent = '新篇章';
                }
            } else {
                titleEl.textContent = '新篇章';
            }

            overlay.classList.add('active');
            setTimeout(() => chTitle.focus(), 100);
        }

        function closeEditor() {
            document.getElementById('editor-overlay').classList.remove('active');
            editingId = null;
        }

        function saveChapter() {
            const title = document.getElementById('editor-ch-title').value.trim();
            const content = document.getElementById('editor-ch-content').value.trim();
            const status = document.getElementById('editor-status');

            if (!title) {
                status.textContent = '⚠️ 请填写标题';
                status.style.color = '#c0392b';
                return;
            }
            if (!content) {
                status.textContent = '⚠️ 正文不能为空';
                status.style.color = '#c0392b';
                return;
            }

            const chapters = getChapters();

            if (editingId) {
                const idx = chapters.findIndex(c => c.id === editingId);
                if (idx !== -1) {
                    chapters[idx].title = title;
                    chapters[idx].content = content;
                    chapters[idx].updatedAt = Date.now();
                }
            } else {
                chapters.push({
                    id: generateId(),
                    title: title,
                    content: content,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                });
            }

            saveChapters(chapters);
            status.textContent = '✅ 已保存 ' + new Date().toLocaleString('zh-CN');
            status.style.color = 'var(--sage-d)';

            setTimeout(() => {
                closeEditor();
                renderChapterList();
            }, 400);
        }

        // ─── 删除 ───
        function deleteChapter(chapterId) {
            if (!confirm('确定删除这个篇章吗？')) return;
            let chapters = getChapters();
            chapters = chapters.filter(c => c.id !== chapterId);
            saveChapters(chapters);
            renderChapterList();
        }

        // ─── 阅读器 ───
        function openReader(chapterId) {
            const chapters = getChapters();
            const ch = chapters.find(c => c.id === chapterId);
            if (!ch) return;

            document.getElementById('reader-title').textContent = ch.title || '无标题';
            document.getElementById('reader-meta').textContent = new Date(ch.createdAt).toLocaleDateString('zh-CN', {
                year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('reader-content').textContent = ch.content || '';
            document.getElementById('reader-overlay').classList.add('active');
        }

        function closeReader() {
            document.getElementById('reader-overlay').classList.remove('active');
        }

        // ESC 关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEditor();
                closeReader();
            }
        });

        document.getElementById('editor-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeEditor();
        });
        document.getElementById('reader-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeReader();
        });

        function ensureDefaultChapters() {
            const chapters = getChapters();
            const hasDefault = chapters.some(ch => ch.title === '妈妈离开家乡前');
            if (hasDefault) return;

            // 篇章1：妈妈离开家乡前
            const content1 = '1954年，妈妈出生在河北省三河市大王各庄。那不是一般的农家——姥爷是当地的地主，家里有些田产。然而，在那个风云激荡的年代，这个身份注定了命运的不同走向。\n\n就在妈妈出生前后，新中国刚刚成立，全国范围内轰轰烈烈的土地改革运动正在展开。1947年颁布的《中国土地法大纲》拉开了这场革命的序幕，到了1950年《中华人民共和国土地改革法》正式实施，占农村人口不到10%的地主、富农占有的可耕土地被没收，分给了无地少地的贫苦农民。姥爷家的田地就是在那个时候被分掉的。所谓"反封建、打倒地主"，对年幼的妈妈来说，是家庭从殷实到清贫的剧变。\n\n三河地处京畿，燕山脚下、潮白河畔，本是土地肥沃的地方。土改之后，家家户户分到了一点田地，但日子依然艰难。妈妈是家里最小的孩子，上面有哥哥姐姐。村里没有电，天一黑整个世界就沉入黑暗，唯一的亮光来自那盏煤油灯——豆大的火苗在灯芯上跳跃，把人的影子拉得老长。灯芯要不时用针挑一挑，不然结了灯花光线会更暗。妈妈就在这昏黄的灯光下做缝纫活儿，一针一线地缝补衣服、纳鞋底。她的手艺是跟姥姥学的，做得又快又好，村里人都说这女娃子手巧。\n\n到了上学的年纪，妈妈背起哥哥姐姐用过的旧书包去了村里的学堂。那大概是1959年前后，正好赶上了三年困难时期的前奏。学堂是村里腾出的几间土房，课桌是用木板搭的，坐的是长条凳。老师是村里识字最多的人，教的是最基本的认字和算术。妈妈很珍惜上学的机会，每天天不亮就起来，走几里地去学堂。\n\n但好景不长。到了1960年代初，情况越来越难。当时农村实行人民公社制度，土地归集体所有，每家每户靠挣工分分粮食。所谓工分，就是生产队根据每个人干的活儿记分——男劳力一天10分，妇女一天6到8分，半大孩子3到5分。到了年底，全队按总工分分粮分钱。妈妈虽然年纪小，也得跟着下地干力所能及的活儿：拾麦穗、拔草、放羊、喂鸡……这些活儿换不来多少工分，但能帮家里减轻一点负担。\n\n那时候村里渐渐有了说法：读书有什么用？还不如多挣几个工分。渐渐地，学堂里的孩子越来越少。先是几个大点的男孩退学了，接着女孩们也一个接一个不来了。妈妈也终于没能继续读下去。对那个年代的农村女孩来说，能识几个字就已经是奢侈了。\n\n不上学了，妈妈就成了生产队里的半劳力。她个子小，力气不大，但从不偷懒。春天跟着插秧，夏天顶着日头锄草，秋天弯腰收庄稼。最苦的是冬天，北方冬天的田野一片荒芜，但活儿并不少——沤肥、修渠、平整土地，手冻得跟胡萝卜似的，皲裂的口子往外渗血。\n\n回到家也不能歇着。妈妈最拿手的就是缝纫。每到晚上，她就着煤油灯做针线活儿——给家里人缝补衣裳、纳鞋底、做棉袄。煤油灯的光很暗，做一会儿眼睛就酸了，第二天擤鼻涕都是黑的。但妈妈的手艺好，针脚又密又匀，村里有人家要做嫁妆、做小孩衣服，也会找她帮忙。帮别人做活儿偶尔能换几个鸡蛋、一把挂面，那就是家里难得的改善。\n\n那些年，妈妈就这样在生产队和家之间两点一线地过着日子。没有什么惊天动地的大事，就是一天一天地过。河北的冬天很长，风从燕山那边刮过来，刮在脸上像刀子割。但妈妈说起那些日子，很少抱怨——她说那时候家家都一样，谁也不比谁好过多少。\n\n后来，村里的年轻人开始往外走。有人说北京招工，有人说天津好找活儿，还有人嫁到了更远的地方。妈妈也在心里埋下了离开的念头。三河离北京不过几十公里，坐火车几个小时就能到。妈妈知道，如果要改变命运，就得走出去。于是，在她还不到二十岁的时候，她收拾好简单的行李，把几件换洗衣服叠得整整齐齐，揣着家里攒的一点零钱，坐上了那趟开往远方的火车。\n\n火车开动的那一刻，窗外的田野、村庄、麦田缓缓后退。妈妈不知道前方等着她的是什么，但她知道，离开是她唯一的选择。\n\n那是她第一次离开家乡，也是她人生中最重要的一次出发。\n\n📚 参考资料：\n• 土地改革·百度百科：https://baike.baidu.com/item/%E5%9C%9F%E5%9C%B0%E6%94%B9%E9%9D%A9/3455375\n• 中国土地法大纲·百度百科：https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E5%9C%9F%E5%9C%B0%E6%B3%95%E5%A4%A7%E7%BA%B2\n• 中华人民共和国土地改革法：https://baike.baidu.com/item/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E5%9C%9F%E5%9C%B0%E6%94%B9%E9%9D%A9%E6%B3%95';
            const ch1 = { id: 'default-' + Date.now().toString(36), createdAt: Date.now(), title: '妈妈离开家乡前', content: content1 };

            // 篇章3：妈妈的工作
            const content3 = '妈妈在巴彦淖尔市财校工作，后来学校并入河套大学。\n\n妈妈在学校的后勤部门工作，是一名面食厨师。她最拿手的是中式糕点——做出来的点心香甜软糯，同事们都说好。还有她的河北烙盒子，馅大皮薄，咬一口满嘴香。\n\n妈妈有中级厨师职称，这在后勤岗位上是不多见的。她对这个职称很看重，因为那是她靠自己的手艺实实在在考下来的。食堂的活儿不轻松，每天凌晨三四点就要起来和面、发面，赶在师生们早餐前准备好。冬天冷，面发得慢，需要提前备好温水和面；夏天热，厨房里像个蒸笼，妈妈围着围裙一站就是几个小时。但她从不喊累，她说做面食是她的本行，看着大家吃得高兴她就开心。\n\n在食堂工作的那些年，妈妈结交了很多好朋友。她们一起干活儿、一起说笑，妈妈性格好，大家都喜欢跟她相处。那些朋友是她生活中很重要的陪伴。可后来因为跟着我们来了深圳，距离远了，慢慢地朋友圈子就联系变少了。妈妈偶尔还会提起她们，每次说起来，眼里都有怀念。\n\n1998年，妈妈和爸爸一样提前退休了。但她闲不住，退休以后开始自己在家做大饼、卖饼丝。每天凌晨四五点就要起床——妈妈后来跟我说，那会儿起来是人最困的时候。但她一天也没落下，就这样起早贪黑，一直做到我2006年上大学。\n\n在财校的那些年里，妈妈见证了学校的发展变化，也见证了学生们来了一茬又走了一茬。很多学生毕业后还记得食堂那个做面食特别好吃的阿姨。\n\n后来，巴彦淖尔市财校并入河套大学，妈妈也随着到了新学校继续在后勤岗位工作。';
            const ch3 = { id: 'work-' + Date.now().toString(36), createdAt: Date.now() - 2000, title: '妈妈的工作', content: content3 };
            chapters.push(ch3);

            // 篇章4：北京，地下室
            const content4 = '我上学的第一个学期，妈妈去了北京打工。她在劲松那边找了一份保姆的工作，住在劲松的地下室里。\n\n那时候看妈妈寄回来的照片，整个人瘦了很多，脸色也不好。地下室潮湿、不见阳光，住久了身上总带着一股霉味儿。妈妈白天在主顾家干活儿，洗衣做饭打扫，晚上回到那个不足十平米的地下小隔间。北京的冬天冷，地下室里又没有暖气，她裹着薄被子缩在床上。\n\n但她从来不跟我们说苦。电话里她总是说"挺好的""主顾人不错""吃得饱穿得暖"。只有照片骗不了人——照片里妈妈穿着朴素的衣服，站在劲松的街头，眼睛里满是疲惫。她那年已经四十多岁了，本来可以在家里安生过日子，却为了供我上学，跑到北京去给人当保姆。\n\n我这辈子都不会忘记妈妈住地下室的那段日子。';
            const ch4 = { id: 'beijing-' + Date.now().toString(36), createdAt: Date.now() - 3000, title: '北京，地下室', content: content4 };
            chapters.push(ch4);

            // 篇章5：回老家后的日子与老年大学
            const content5 = '后来妈妈回了老家，不再往外跑了。虽然不再去北京打工，但她也闲不下来。她一边给别人打零工挣点零花钱，一边操持地里的活儿。\n\n北方的地里有干不完的活儿。春天要去地里锄草，夏天顶着大太阳给庄稼浇水，秋天弯腰割麦子掰玉米，冬天还要去地里捡柴火准备过冬烧炕。妈妈的手常年都是粗粝的，满是老茧和裂口。她穿着旧衣裳，戴着草帽，蹲在地里一干就是大半天。\n\n但日子也在一点一点变好。后来妈妈终于不用那么辛苦了，她开始去参加老年大学。老年大学里什么都有——书法、绘画、唱歌、跳舞……妈妈选了太极。\n\n她打太极打得真好。每天早上，在公园的广场上，她跟着音乐缓缓起势，白鹤亮翅、手挥琵琶、搂膝拗步……一套二十四式打下来，动作舒展大方、连贯流畅。老年大学的老师说她有悟性，一点就通。妈妈自己也喜欢，她说打太极的时候什么都不想，心是静的。\n\n那是妈妈晚年最舒心的时光。操劳了一辈子，终于有了自己的爱好和时间。';
