            tip: '妈妈的小窍门：粉条容易吸水，水要一次加够。豆腐先煎一下再炖更香，不容易碎。'
        },
        {
            emoji: '🥘', name: '猪肉烩酸菜',
            desc: '东北风味的经典菜。酸菜配上猪肉，酸爽开胃，冬天吃一碗浑身都暖和。',
            ingredients: '东北酸菜 500g、五花肉 200g、粉条 1把、姜片、八角、花椒、盐',
            steps: [
                '酸菜洗净切丝，泡水10分钟去部分酸味（喜欢酸的可不泡）',
                '五花肉切片，粉条泡软',
                '热锅倒油，下五花肉煸炒出油',
                '下姜片、八角、花椒炒香',
                '下酸菜大火翻炒2分钟',
                '加足量热水，大火烧开转小火炖30分钟',
                '下粉条继续炖10分钟，加盐调味'
            ],
            tip: '妈妈的小窍门：酸菜要多炒一会儿，炒出酸菜的香味再加水炖，味道才足。'
        },
        {
            emoji: '🥘', name: '溜肥肠',
            desc: '妈妈做的溜肥肠，处理得干干净净，没有异味，滑嫩Q弹。爱吃的人一次能吃一盘。',
            ingredients: '熟肥肠 300g、青红椒各半个、蒜末、姜片、生抽、老抽、醋、糖、淀粉',
            steps: [
                '熟肥肠切段，青红椒切片',
                '锅中烧水，肥肠焯水1分钟捞出沥干',
                '调碗汁：生抽2勺、老抽半勺、醋1勺、糖1小勺、淀粉1勺、水3勺',
                '热锅倒油，爆香姜蒜，下肥肠大火翻炒',
                '下青红椒翻炒，倒入碗汁',
                '大火快速翻炒至汤汁浓稠裹在肥肠上即可'
            ],
            tip: '妈妈的小窍门：买回来的熟肥肠最好再焯一遍水，更干净。溜肥肠一定要大火快炒，炒久了就不嫩了。'
        }
    ];

    // Render dish list
    const list = document.getElementById('dish-list');
    dishes.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'dish-card';
        card.innerHTML = `
            <h3>${d.emoji} ${d.name}</h3>
            <div class="preview"><span>查看做法</span><span class="arrow">→</span></div>
        `;
        card.addEventListener('click', () => openRecipe(i));
        list.appendChild(card);
    });

    // Modal
    const modal = document.getElementById('recipe-modal');
    const overlay = modal.querySelector('.rm-overlay');
    const closeBtn = modal.querySelector('.rm-close');

    function openRecipe(index) {
        const d = dishes[index];
        modal.querySelector('.rm-emoji').textContent = d.emoji;
        modal.querySelector('.rm-name').textContent = d.name;
        modal.querySelector('.rm-sub').textContent = d.desc;
        modal.querySelector('.rm-ingredients span').textContent = d.ingredients;
        const stepsEl = modal.querySelector('.rm-steps');
        stepsEl.innerHTML = d.steps.map(s => `<li>${s}</li>`).join('');
        modal.querySelector('.rm-tip').textContent = '💡 ' + d.tip;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeRecipe() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    overlay.addEventListener('click', closeRecipe);
    closeBtn.addEventListener('click', closeRecipe);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRecipe(); });
</script>

</body>
</html>
